# Alembic configuration for SMP12C VibroDiag Analyzer v1.3

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Syspath, path needed at runtime.
prepend_sys_path = .

# Truncate long revision names
truncate_slug_length = 40

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions
sourceless = false

# Version path separator
version_path_separator = os

# The output encoding used when revision files are written
output_encoding = utf-8

# SQLAlchemy URL (будет переопределено в env.py)
sqlalchemy.url = postgresql+psycopg2://postgres:password@localhost/vibrodiag

[post_write_hooks]
# Run black formatter after generating migrations
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
