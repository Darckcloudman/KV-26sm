[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smp12c-vibrodiag"
version = "1.4.0"
description = "SMP12C VibroDiag Analyzer — вибродиагностика ветротурбин"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "qtawesome>=1.4",
]

[tool.pyright]
include = ["smp12c_vibrodiag"]
exclude = [
    "**/__pycache__",
    "**/tests",
    "smp12c_vibrodiag/gui/main_window_old.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"

# PySide6 — строгие правила для enum
reportGeneralTypeIssues = "error"
reportAttributeAccessIssue = "error"
reportArgumentType = "error"
reportAssignmentType = "error"
reportReturnType = "error"

# Не строгие (чтобы не мешали)
reportMissingTypeStubs = "none"
reportMissingTypeArgument = "none"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportMissingImports = "error"

# Специфично для Qt
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalSubscript = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["smp12c_vibrodiag*"]
