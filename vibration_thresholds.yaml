# Пороговые значения вибрации согласно ISO 10816-21:2015 / ГОСТ 10816-21-2021
# Для крупных ветрогенераторов (>300 кВт)

acceleration:
  unit: "м/с²"
  frequency_range: "0.1–10 Гц"
  thresholds:
    zone_a: 1.0    # Отлично (новый узел)
    zone_b: 2.5    # Хорошо (пригодно без ограничений)
    zone_c: 5.0    # Удовлетворительно (требуется внимание)
    # > 5.0 -> зона D (критический)

velocity:
  unit: "мм/с"
  frequency_range: "10–1000 Гц"
  thresholds:
    zone_a: 2.3    # Отлично (новый узел)
    zone_b: 4.5    # Хорошо (пригодно без ограничений)
    zone_c: 11.2   # Удовлетворительно (требуется внимание)
    # > 11.2 -> зона D (критический)

zone_descriptions:
  zone_a: "Узел нового ветрогенератора, только что введённого в эксплуатацию. Работает в условиях постоянных нагрузок и низкой турбулентности."
  zone_b: "Узел пригоден для дальнейшего функционирования без ограничения сроков."
  zone_c: "Узел непригоден для длительной непрерывной эксплуатации. Требуется выяснение причины повышенной вибрации."
  zone_d: "Критический уровень вибрации. Требуется немедленная остановка!"

max_turbine_values:
  power_mw: 3.54
  generator_speed_rpm: 1200
  wind_speed_ms: 35
